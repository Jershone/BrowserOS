name: Test real Linux desktop container

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/desktop-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the Codespaces desktop image
        run: docker build --pull -f .devcontainer/Dockerfile -t browseros-linux-desktop .devcontainer

      - name: Check the non-root Codespaces user
        run: docker run --rm browseros-linux-desktop id vscode

      - name: Start a real XFCE desktop in the container
        run: |
          docker run -d --name browseros-linux-test --user vscode --shm-size=1g \
            -e HOME=/home/vscode -e DISPLAY=:1 \
            -p 6080:6080 \
            -v "$PWD:/workspaces/BrowserOS" \
            -w /workspaces/BrowserOS \
            browseros-linux-desktop \
            bash -lc "bash .devcontainer/start-desktop.sh && sleep infinity"

      - name: Verify the actual Linux desktop and reference layout
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:6080/vnc.html | grep -qi 'noVNC'
          sleep 10

          docker exec --user vscode -e HOME=/home/vscode -e DISPLAY=:1 browseros-linux-test bash -lc '
            set -e
            command -v chromium
            command -v libreoffice
            command -v thunar
            command -v xfce4-terminal
            command -v xfce4-taskmanager
            command -v tigervncserver
            command -v websockify
            test -f /usr/share/novnc/vnc.html

            pgrep -a xfce4-session
            pgrep -a xfwm4
            pgrep -a xfce4-panel
            pgrep -a plank

            # Ensure actual native Thunar and Terminal top-level windows exist.
            wmctrl -lx | grep -i thunar
            wmctrl -l | grep -i "BrowserOS Terminal"

            # Check that both real windows were positioned in the intended layout.
            thunar_geometry="$(wmctrl -lG | awk 'tolower($0) ~ /thunar/ {print $3, $4, $5, $6; exit}')"
            terminal_geometry="$(wmctrl -lG | awk 'tolower($0) ~ /browseros terminal/ {print $3, $4, $5, $6; exit}')"
            read -r tx ty tw th <<< "$thunar_geometry"
            read -r cx cy cw ch <<< "$terminal_geometry"
            test "$tx" -ge 70 && test "$ty" -ge 80 && test "$tw" -ge 600 && test "$th" -ge 400
            test "$cx" -ge 750 && test "$cy" -ge 250 && test "$cw" -ge 650 && test "$ch" -ge 400

            # Ensure custom wallpaper, clean desktop and one bottom system panel.
            grep -q "browseros-wallpaper.svg" /home/vscode/.cache/browseros-wallpaper-settings.txt
            grep -q "p=12" /home/vscode/.cache/browseros-panel-settings.txt
            test "$(xfconf-query -c xfce4-desktop -p /desktop-icons/style)" = "0"
            test "$(wmctrl -lG | grep -c "xfce4-panel.Xfce4-panel")" = "1"

            DISPLAY=:1 import -window root /tmp/browseros-desktop.png
            test -s /tmp/browseros-desktop.png
            echo "PASS: XFCE, native apps, correctly placed native windows, custom wallpaper, clean desktop, single dock, bottom panel and noVNC are working."
          '

      - name: Collect desktop diagnostics
        if: always()
        run: |
          mkdir -p browseros-diagnostics
          docker cp browseros-linux-test:/home/vscode/.cache/. browseros-diagnostics/ 2>/dev/null || true
          docker cp browseros-linux-test:/home/vscode/.vnc/. browseros-diagnostics/vnc/ 2>/dev/null || true
          docker cp browseros-linux-test:/tmp/browseros-thunar.log browseros-diagnostics/ 2>/dev/null || true
          docker cp browseros-linux-test:/tmp/browseros-terminal.log browseros-diagnostics/ 2>/dev/null || true
          docker cp browseros-linux-test:/tmp/browseros-plank.log browseros-diagnostics/ 2>/dev/null || true
          docker cp browseros-linux-test:/tmp/browseros-panel.log browseros-diagnostics/ 2>/dev/null || true
          docker exec --user vscode -e HOME=/home/vscode -e DISPLAY=:1 browseros-linux-test wmctrl -lx > browseros-diagnostics/windows.txt 2>&1 || true
          docker exec --user vscode -e HOME=/home/vscode -e DISPLAY=:1 browseros-linux-test xrandr --query > browseros-diagnostics/xrandr.txt 2>&1 || true
          tar -czf browseros-diagnostics.tar.gz browseros-diagnostics

      - name: Save desktop screenshot
        if: success()
        run: docker cp browseros-linux-test:/tmp/browseros-desktop.png ./browseros-desktop.png

      - name: Upload diagnostics and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browseros-linux-diagnostics
          path: |
            browseros-diagnostics.tar.gz
            browseros-desktop.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs browseros-linux-test || true
          docker exec --user vscode -e HOME=/home/vscode browseros-linux-test bash -lc 'cat ~/.vnc/*.log ~/.cache/browseros-session-setup.log /tmp/browseros-*.log 2>/dev/null || true' || true

      - name: Cleanup
        if: always()
        run: docker rm -f browseros-linux-test || true
